# Tema do painel — travado no repositório de propósito.
#
# Sem este arquivo o Streamlit herda o tema do NAVEGADOR de quem abre: a mesma tela
# apareceria clara na máquina do professor e escura na nossa, e os mapas (que têm fundo
# próprio) ficariam coerentes numa e quebrados na outra. Fixando aqui, a apresentação é
# a mesma em qualquer máquina.
#
# A paleta é a de um documento impresso: papel, tinta e uma única cor de acento. O motivo
# está escrito por extenso no topo de `ui.py` — e os valores abaixo são os MESMOS tokens
# declarados lá. São dois consumidores do mesmo valor: este arquivo pinta os widgets
# nativos (input, tabela, slider), o ui.py pinta o nosso CSS e os gráficos. Mudar uma cor
# exige tocar nos dois.

[theme]
base = "light"

# Óxido — a única cor de acento do painel. Marca o que exige atenção: aba ativa, número
# do achado central, faixa de dependência alta, link.
primaryColor = "#A8341E"

# Papel, não branco de tela: o branco puro estoura no projetor e cansa a leitura; um
# off-white levemente quente é o que se lê em documento impresso.
backgroundColor = "#F4F3EE"

# Superfície secundária MAIS ESCURA que o fundo — o inverso do que um tema escuro faz.
# Em papel, uma faixa destacada é uma área impressa, não uma área iluminada.
secondaryBackgroundColor = "#EAE8E0"

textColor = "#14140F"
linkColor = "#A8341E"

# As fontes vivem em `static/fontes/` e são declaradas em @font-face no ui.py (o painel
# roda offline: nada de Google Fonts). Aqui fica só a família de recurso, para os widgets
# nativos que o Streamlit pinta antes de o nosso CSS carregar.
font = "sans-serif"

# Cantos vivos em todo o painel: raio zero é decisão de linguagem visual (documento, não
# aplicativo), e o "medium" padrão é justamente o meio-termo que não decide nada.
baseRadius = "none"
borderColor = "#D4D1C6"
dataframeBorderColor = "#A8A497"
dataframeHeaderBackgroundColor = "#EAE8E0"
codeBackgroundColor = "#EAE8E0"

[client]
# Esconde o menu de deploy/hambúrguer do Streamlit Cloud durante a apresentação.
toolbarMode = "minimal"

[server]
# Serve a pasta `static/` em /app/static/. É o que permite carregar as fontes IBM Plex
# do PRÓPRIO projeto: o painel roda offline (regra nº 1), e um <link> para o Google Fonts
# dependeria de rede. Servidas como arquivo, elas entram no cache do navegador uma vez —
# embutir os 73 KB em base64 no CSS os reenviaria a cada clique do usuário.
enableStaticServing = true
